/* Админ-панель P2Pro: только для владельца. Данные и действия — через функцию telegram-bot (admin_api), доступ проверяет сервер */
:root { --bg: #0C0F14; --s1: #12171F; --s2: #182029; --s3: #1F2833; --line: #252E3A; --fg: #E8ECF2; --muted: #8691A2; --dim: #5B6577;
  --acc: #F2B54B; --acc-s: rgba(242,181,75,.14); --pos: #3CD38A; --pos-s: rgba(60,211,138,.14); --neg: #FF6B6B; --neg-s: rgba(255,107,107,.14);
  --blue: #5AA9FF; --blue-s: rgba(90,169,255,.14); --vio: #A78BFA; --r: 18px; --f-d: Unbounded, sans-serif; --f-m: 'JetBrains Mono', monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 Onest, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: var(--acc); }
.mono { font-family: var(--f-m); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 13px; } .pos { color: var(--pos); } .neg { color: var(--neg); }
[hidden] { display: none !important; }

/* фон: мягкое золотое свечение и сетка, как в приложении */
.bgfx { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(50% 40% at 15% 0%, rgba(242,181,75,.10), transparent 70%), radial-gradient(40% 40% at 100% 100%, rgba(60,211,138,.06), transparent 70%); }
.bgfx::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
  background-size: 64px 64px; -webkit-mask-image: radial-gradient(70% 60% at 50% 30%, #000, transparent); mask-image: radial-gradient(70% 60% at 50% 30%, #000, transparent); }

/* вход */
.gate { position: relative; z-index: 1; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.gate-card { width: 100%; max-width: 400px; background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02)); border: 1px solid var(--line); border-radius: 28px;
  padding: 36px 28px 28px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.45); animation: up .5s cubic-bezier(.2,.8,.3,1) both; }
.gate-card h1 { margin: 6px 0 0; font: 700 24px var(--f-d); letter-spacing: -.5px; }
.tile { width: 64px; height: 64px; border-radius: 19px; background: var(--acc); color: #1B1405; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--f-d); line-height: .9; flex: none; }
.tile b { font-size: 25px; letter-spacing: -1.5px; } .tile i { font-style: normal; font-size: 8px; letter-spacing: 2.5px; margin-top: 3px; }
.tile.sm { width: 40px; height: 40px; border-radius: 12px; } .tile.sm b { font-size: 16px; letter-spacing: -1px; } .tile.sm i { font-size: 5.5px; letter-spacing: 1.6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 16px; border-radius: 13px; background: var(--s3); border: 1px solid var(--line); font-weight: 600; font-size: 14px;
  transition: transform .15s, background .2s, border-color .2s; white-space: nowrap; text-decoration: none; color: var(--fg); }
.btn:hover { background: #26303D; } .btn:active { transform: scale(.97); }
.btn.pri { background: var(--acc); border-color: var(--acc); color: #1B1405; } .btn.pri:hover { background: #F6C164; }
.btn.danger { color: var(--neg); border-color: rgba(255,107,107,.35); background: var(--neg-s); }
.btn.ghost { background: transparent; }
.btn.small { padding: 7px 11px; font-size: 12.5px; border-radius: 10px; }
.btn.wide { width: 100%; padding: 14px; font-size: 15px; }
.btn:disabled { opacity: .55; pointer-events: none; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: rot .8s linear infinite; display: inline-block; }
@keyframes rot { to { transform: rotate(360deg); } }
@keyframes up { from { opacity: 0; transform: translateY(14px); } }

/* каркас */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 22px 14px; border-right: 1px solid var(--line); background: rgba(12,15,20,.7); backdrop-filter: blur(14px); display: flex; flex-direction: column; gap: 6px; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 18px; }
.brand b { display: block; font: 700 17px var(--f-d); letter-spacing: -.5px; } .brand span { font-size: 12px; color: var(--muted); }
.nav-b { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; color: var(--muted); font-weight: 600; text-align: left; width: 100%; transition: background .2s, color .2s; }
.nav-b svg { width: 19px; height: 19px; flex: none; }
.nav-b:hover { background: var(--s2); color: var(--fg); }
.nav-b.on { background: var(--acc-s); color: var(--acc); }
.side-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.me-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.ava { width: 34px; height: 34px; border-radius: 50%; background: var(--s3); display: grid; place-items: center; font-weight: 700; color: var(--acc); flex: none; overflow: hidden; font-size: 14px; }
.ava img { width: 100%; height: 100%; object-fit: cover; }
.main { padding: 28px 32px 60px; min-width: 0; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.head h2 { margin: 0; font: 700 28px var(--f-d); letter-spacing: -1px; }
.head .muted { margin-top: 4px; }

/* карточки и показатели */

.kpis { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.card { background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.015)); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.kpi { position: relative; overflow: hidden; animation: up .5s cubic-bezier(.2,.8,.3,1) both; animation-delay: calc(var(--i, 0) * 60ms); }
.kpi .lb { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.kpi .ic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 14px; background: var(--s3); }
.kpi .v { margin-top: 12px; font: 700 28px var(--f-d); letter-spacing: -1px; white-space: nowrap; }
.kpi .sub { margin-top: 4px; font-size: 13px; color: var(--muted); }
.kpi .glow { position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%; filter: blur(34px); opacity: .28; pointer-events: none; }
.card-t { font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-t .muted { font-weight: 500; font-size: 13px; }
.charts { grid-template-columns: 2fr 1fr; margin-top: 16px; }
.charts2 { grid-template-columns: 1fr 1fr; margin-top: 16px; }
.chart-box { position: relative; height: 260px; }
.chart-box.sm { height: 220px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-weight: 500; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }

/* списки и таблицы */
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t1 { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t2 { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; background: var(--s3); color: var(--muted); }
.badge.pro { background: var(--acc-s); color: var(--acc); } .badge.trial { background: var(--blue-s); color: var(--blue); } .badge.ban { background: var(--neg-s); color: var(--neg); }
.badge.ok { background: var(--pos-s); color: var(--pos); } .badge.gift { background: rgba(167,139,250,.15); color: var(--vio); }
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.search { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 13px; background: var(--s2); border: 1px solid var(--line); color: var(--muted); }
.search input { flex: 1; background: none; border: 0; outline: 0; padding: 12px 0; color: var(--fg); min-width: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--s1); color: var(--muted); font-weight: 600; font-size: 13px; transition: all .2s; }
.chip:hover { color: var(--fg); } .chip.on { background: var(--acc-s); border-color: rgba(242,181,75,.45); color: var(--acc); }
.chip b { font-family: var(--f-m); font-weight: 600; margin-left: 5px; }
select.sel { padding: 11px 12px; border-radius: 12px; background: var(--s2); border: 1px solid var(--line); outline: 0; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.tbl tbody tr { cursor: pointer; transition: background .15s; animation: up .35s ease both; }
.tbl tbody tr:hover { background: rgba(255,255,255,.03); }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl .num { text-align: right; font-family: var(--f-m); }
.who { display: flex; align-items: center; gap: 11px; min-width: 0; }
.who .t1 { font-weight: 600; } .who .t2 { font-size: 12.5px; color: var(--muted); }
.ucards { display: none; flex-direction: column; gap: 10px; padding: 6px; }
.ucard { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: var(--s1); border: 1px solid var(--line); text-align: left; width: 100%; animation: up .35s ease both; }
.empty { padding: 40px 10px; text-align: center; color: var(--muted); }
.more { margin-top: 14px; width: 100%; }

/* боковая панель пользователя */
.scrim { position: fixed; inset: 0; background: rgba(5,7,10,.6); backdrop-filter: blur(4px); z-index: 40; opacity: 0; transition: opacity .25s; }
.scrim.on { opacity: 1; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); z-index: 41; background: var(--s1); border-left: 1px solid var(--line); overflow-y: auto;
  transform: translateX(100%); transition: transform .32s cubic-bezier(.2,.8,.3,1); padding: 22px 22px 40px; display: flex; flex-direction: column; gap: 16px; }
.drawer.on { transform: none; }
.dr-head { display: flex; align-items: center; gap: 14px; }
.dr-head .ava { width: 54px; height: 54px; font-size: 20px; }
.dr-head h3 { margin: 0; font: 700 20px var(--f-d); letter-spacing: -.5px; }
.x { margin-left: auto; width: 38px; height: 38px; border-radius: 12px; background: var(--s3); display: grid; place-items: center; font-size: 22px; color: var(--muted); flex: none; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fact { background: var(--s2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
.fact .lb { font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.fact .v { margin-top: 4px; font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.sec { background: var(--s2); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.sec h4 { margin: 0; font-size: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.inl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.inp { padding: 10px 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); outline: 0; min-width: 0; transition: border-color .2s; }
.inp:focus { border-color: rgba(242,181,75,.6); }
.inp.n { width: 106px; font-family: var(--f-m); }
textarea.inp { width: 100%; min-height: 110px; resize: vertical; line-height: 1.5; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }

/* рассылка: превью как в Telegram */
.bc { grid-template-columns: 1.2fr 1fr; }
.tgprev { background: #0E1621; background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px); background-size: 18px 18px; border-radius: 16px; padding: 18px; min-height: 260px;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; }
.bubble { align-self: flex-start; max-width: 92%; background: #182533; border-radius: 16px 16px 16px 6px; padding: 10px 13px 8px; font-size: 14.5px; white-space: pre-wrap; word-break: break-word; animation: up .3s ease both; }
.bubble .tm { display: block; text-align: right; font-size: 11px; color: #6D8399; margin-top: 2px; }
.tgbtn { align-self: flex-start; width: min(320px, 92%); text-align: center; padding: 9px; border-radius: 10px; background: rgba(24,37,51,.85); color: #8CC6FF; font-size: 13.5px; font-weight: 600; }

/* всплывашки и подтверждение */
.toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); opacity: 0; z-index: 60; background: #222B37; border: 1px solid var(--line); color: var(--fg); pointer-events: none;
  padding: 12px 18px; border-radius: 14px; font-weight: 600; font-size: 14px; box-shadow: 0 14px 40px rgba(0,0,0,.45); transition: all .3s cubic-bezier(.2,.8,.3,1); max-width: calc(100vw - 32px); text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.err { border-color: rgba(255,107,107,.5); }
.modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; background: rgba(5,7,10,.6); backdrop-filter: blur(4px); animation: fade .2s both; }
.modal > div { width: 100%; max-width: 380px; background: var(--s1); border: 1px solid var(--line); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 12px; animation: up .3s cubic-bezier(.2,.8,.3,1) both; }
.modal h3 { margin: 0; font: 700 18px var(--f-d); } .modal .inl { justify-content: flex-end; margin-top: 6px; }
@keyframes fade { from { opacity: 0; } }
.sk { background: linear-gradient(90deg, var(--s2), var(--s3), var(--s2)); background-size: 200% 100%; animation: sk 1.2s linear infinite; border-radius: 10px; }
@keyframes sk { to { background-position: -200% 0; } }

/* мобильная версия */
.tabbar { display: none; }
.mtop { display: none; align-items: center; gap: 12px; margin-bottom: 18px; }
.mtop b { font: 700 16px var(--f-d); }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .main { padding: 18px 16px 110px; }
  .head h2 { font-size: 23px; }
  .charts, .charts2, .bc { grid-template-columns: 1fr; }
  .tbl-wrap { display: none; } .ucards { display: flex; }
  .tabbar { display: flex; position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 30; padding: 6px; gap: 2px; border-radius: 22px; background: rgba(22,28,36,.92); backdrop-filter: blur(16px);
    border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(0,0,0,.45); }
  .tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px; border-radius: 16px; color: var(--muted); font-size: 10.5px; font-weight: 600; }
  .tabbar button svg { width: 21px; height: 21px; }
  .tabbar button.on { color: var(--acc); background: var(--acc-s); }
  .mtop { display: flex; }
  .kpis { grid-template-columns: 1fr 1fr; gap: 12px; }
  .kpi .v { font-size: 21px; }
  .card { padding: 15px; }
  .drawer { width: 100vw; border-left: 0; padding: 18px 16px 40px; }
  .toast { bottom: 96px; }
  .head [data-ref] { display: none; }   /* на телефоне «Обновить» — в верхней строке */
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

async function api(action, extra = {}) {
  const token = (await sb.auth.getSession()).data?.session?.access_token;
  if (!token) throw Object.assign(new Error('Нужно войти'), { code: 401 });
  const r = await fetch(SB_URL + '/functions/v1/telegram-bot', { method: 'POST', headers: { 'content-type': 'application/json', apikey: SB_KEY },
    body: JSON.stringify({ admin_api: action, access_token: token, ...extra }), signal: AbortSignal.timeout?.(60000) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw Object.assign(new Error(j.error || 'Ошибка сервера ' + r.status), { code: r.status });
  return j;
}

async function boot() {
  const { data } = await sb.auth.getSession();

    gate('Не получилось связаться с сервером: ' + esc(e.message) + '.<br>Если функцию telegram-bot только что обновляли — проверьте, что она задеплоена.', '<button class="btn pri wide" id="retry">Попробовать снова</button>');

// Вход как на сайте: бот присылает «Войти», а мы раз в 2 секунды спрашиваем сервер, подтвердили ли
let loginRun = 0;
async function tgLogin() {
  const id = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
  const url = 'https://t.me/P2ProAppBot?start=login_' + id, run = ++loginRun;
  window.open(url, '_blank');
  gate('Откроется бот @P2ProAppBot. Нажмите там «✅ Войти» и вернитесь сюда.', `<div class="btn wide" style="pointer-events:none"><span class="spin"></span> Ждём подтверждение…</div><a class="btn ghost wide" href="${url}" target="_blank" rel="noopener">${TG_SVG} Открыть Telegram</a>`);
  for (const until = Date.now() + 5 * 60e3; Date.now() < until;) {
    await wait(2000);
    if (run !== loginRun) return;
    let j = {};
    try { j = await (await fetch(SB_URL + '/functions/v1/telegram-auth', { method: 'POST', headers: { 'content-type': 'application/json', apikey: SB_KEY }, body: JSON.stringify({ web_login: id }) })).json(); } catch (e) { continue; }
    if (j.access_token) { await sb.auth.setSession({ access_token: j.access_token, refresh_token: j.refresh_token }); return boot(); }
    if (j.status === 'no') return gate('Вход отменён в Telegram.', TG_BTN);
    if (j.status === 'expired' || j.error) return gate('Ссылка устарела — попробуйте ещё раз.', TG_BTN);
  }
  gate('Время вышло — попробуйте ещё раз.', TG_BTN);
}

$('drawer').addEventListener('click', async e => {

  let call;
  if (dc) { if (!await confirmBox('Скидка ' + dc.dataset.disc + '%', `Для ${esc(u.name)} — и в рублях, и в звёздах. Человек получит сообщение.`, 'Сделать скидку')) return; call = ['discount', { pct: +dc.dataset.disc }]; }
  else if (a === 'give') { const d = n('gDays'); if (!await confirmBox('Подарить PRO', `${d} ${plural(d, 'день', 'дня', 'дней')} PRO для ${esc(u.name)}.`, 'Подарить')) return; call = ['give', { days: d }]; }

  else if (a === 'ban') { if (!await confirmBox(u.banned ? 'Разблокировать?' : 'Заблокировать?', u.banned ? 'Человек снова сможет входить.' : 'Человек не сможет входить в P2Pro.', u.banned ? 'Разблокировать' : 'Заблокировать', !u.banned)) return; call = ['ban', { on: !u.banned }]; }
  else if (a === 'price_rub') { if (!n('pRm')) return toast('Впишите цену за месяц', true); call = ['price', { cur: 'rub', m: n('pRm'), y: n('pRy') || undefined }]; }

});

  $('bcGo').onclick = async () => {
    if (!BC.text.trim()) return toast('Напишите текст', true);
    const cnt = n[BC.aud]; if (!await confirmBox('Отправить рассылку?', `Получат ${cnt} ${plural(cnt, 'человек', 'человека', 'человек')} (${A.find(x => x[0] === BC.aud)[1].toLowerCase()}). Отменить будет нельзя.`, 'Отправить')) return;
    $('bcGo').disabled = true;
    try { const r = await api('bc_send', { text: BC.text, aud: BC.aud }); toast(`Рассылка пошла: ${r.n} получателей. Итог придёт в бот`); BC.text = ''; $('bcT').value = ''; prev(); } catch (e) { toast(e.message, true); }
    $('bcGo').disabled = false;
  };
}

boot();
</script>
</body>
</html>
