# Деплой функций Supabase (telegram-bot, telegram-auth) прямо с GitHub — без копирования кода в браузере.
# Запускается сам при изменениях в supabase/functions и вручную (Actions → Deploy functions → Run workflow).
# Нужен секрет репозитория SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens). Сам токен в код не попадает.
name: Deploy functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-functions.yml']

concurrency: { group: deploy-functions, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT: liddntvlxlupwfhpuwnp
    steps:
      - name: Check token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Нет секрета SUPABASE_ACCESS_TOKEN — добавьте его в Settings → Secrets and variables → Actions"
            exit 1
          fi
      - uses: actions/checkout@v4
      # Версия закреплена: «latest» каждый раз спрашивает у GitHub, какая версия свежая, и этот запрос иногда падает (504).
      # Если первая попытка не удалась — пробуем ещё раз через 20 секунд
      - id: cli1
        uses: supabase/setup-cli@v1
        continue-on-error: true
        with:
          version: 3.0.0
      - if: steps.cli1.outcome == 'failure'
        run: sleep 20
      - if: steps.cli1.outcome == 'failure'
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      # Telegram и приложение зовут функции без JWT — проверку JWT оставляем выключенной, как сейчас
      - name: Deploy telegram-bot
        run: supabase functions deploy telegram-bot --project-ref "$PROJECT" --no-verify-jwt --use-api --yes
      - name: Deploy telegram-auth
        run: supabase functions deploy telegram-auth --project-ref "$PROJECT" --no-verify-jwt --use-api --yes
